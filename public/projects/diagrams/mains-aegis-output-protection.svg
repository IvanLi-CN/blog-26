<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc"><title id="title">保护与输出准入</title><desc id="desc">监测、温度、BMS 与 TPS 状态共同决定输出是否允许开启。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" class="arrow"/></marker><style>.bg{fill:#fbfdfb}.box{fill:#f4faf6;stroke:#477b68;stroke-width:2}.power{fill:#fff8e8;stroke:#ae8344;stroke-width:2}.control{fill:#edf4ff;stroke:#4d6f9f;stroke-width:2}.label{font:600 20px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#18352b}.small{font:15px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#466057}.arrow{fill:#477b68}.line{stroke:#477b68;stroke-width:3;fill:none;marker-end:url(#arrow)}@media (prefers-color-scheme:dark){.bg{fill:#14211d}.box{fill:#1d3029;stroke:#78b99e}.power{fill:#342c1d;stroke:#d2ad68}.control{fill:#202d43;stroke:#8eaddb}.label{fill:#edf7f1}.small{fill:#b7cec2}.line{stroke:#78b99e}.arrow{fill:#78b99e}}</style></defs><rect width="1180" height="430" rx="26" class="bg"/><text x="40" y="48" class="label">保护与输出准入</text><text x="40" y="75" class="small">监测、温度、BMS 与 TPS 状态共同决定输出是否允许开启。</text><rect x="40" y="155" width="190" height="80" rx="14" class="box"/><text x="135.0" y="193" text-anchor="middle" class="label">INA3221</text><text x="135.0" y="220" text-anchor="middle" class="small">VIN / 两路 TPS 输出</text><rect x="300" y="155" width="190" height="80" rx="14" class="power"/><text x="395.0" y="193" text-anchor="middle" class="label">PV / Critical</text><text x="395.0" y="220" text-anchor="middle" class="small">欠压与过流告警</text><rect x="560" y="155" width="190" height="80" rx="14" class="box"/><text x="655.0" y="193" text-anchor="middle" class="label">TMP112A</text><text x="655.0" y="220" text-anchor="middle" class="small">温度告警</text><rect x="820" y="155" width="190" height="80" rx="14" class="power"/><text x="915.0" y="193" text-anchor="middle" class="label">THERM_KILL_N</text