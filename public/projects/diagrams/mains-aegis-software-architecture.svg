<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc"><title id="title">Mains Aegis 软件架构</title><desc id="desc">ESP32-S3 固件通过驱动层采集硬件状态，由状态与保护层决定输出，再由界面和通信层呈现。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m0 0 10 5-10 5z" class="arrow"/></marker><style>.bg{fill:#fbfdfb}.box{fill:#f4faf6;stroke:#477b68;stroke-width:2}.power{fill:#fff8e8;stroke:#ae8344;stroke-width:2}.control{fill:#edf4ff;stroke:#4d6f9f;stroke-width:2}.group{fill:none;stroke:#b9cec3;stroke-width:2;stroke-dasharray:7 7}.label{font:600 20px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#18352b}.small{font:15px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#466057}.group-label{font:600 16px -apple-system,BlinkMacSystemFont,"Noto Sans SC",sans-serif;fill:#477b68}.arrow{fill:#477b68}.line{stroke:#477b68;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke:#4d6f9f;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}@media (prefers-color-scheme:dark){.bg{fill:#14211d}.box{fill:#1d3029;stroke:#78b99e}.power{fill:#342c1d;stroke:#d2ad68}.control{fill:#202d43;stroke:#8eaddb}.group{stroke:#536e62}.label{fill:#edf7f1}.small{fill:#b7cec2}.group-label{fill:#78b99e}.line{stroke:#78b99e}.dashed{stroke:#8eaddb}.arrow{fill:#78b99e}}</style></defs><rect width="1280" height="590" rx="26" class="bg"/><text x="40" y="48" class="label">软件架构</text><text x="40" y="76" class="small">硬件驱动提供状态，控制层执行准入与保护，界面和通信层共享同一运行状态。</text><rect x="35" y="115" width="280" height="380" rx="18" class="group"/><text x="55" y="143" class="group-label">硬件驱动层</text><rect x="60" y="170" width="230" height="52" rx="12" class="box"/><text x="175" y="202" text-anchor="middle" class="label">USB PD / BQ25792</text><rect x="60" y="245" width="230" height="52" rx="12" class="box"/><text x="175" y="277" text-anchor="middle" class="label">BQ40Z50-R2</text><rect x="60" y="320" width="230" height="52" rx="12" class="box"/><text x="175" y="352" text-anchor="middle" class="label">TPS55288 × 2</text><rect x="60" y="395" width="230" height="52" rx="12" class="box"/><text x="175" y="427" text-anchor="middle" class="label">INA3221 / TMP112A</text><rect x="380" y="115" width="360" height="380" rx="18" class="group"/><text x="400" y="143" class="group-label">状态与控制层</text><rect x="410" y="170" width="300" height="60" rx="13" class="power"/><text x="560" y="207" text-anchor="middle" class="label">启动自检</text><rect x="410" y="255" width="300" height="60" rx="13" class="power"/><text x="560" y="292" text-anchor="middle" class="label">输入 / 充电状态</text><rect x="410" y="340" width="300" height="60" rx="13" class="power"/><text x="560" y="377" text-anchor="middle" class="label">输出准入与保护</text><rect x="410" y="425" width="300" height="60" rx="13" class="control"/><text x="560" y="462" text-anchor="middle" class="label">运行状态</text><path d="M290 196h120" class="line"/><path d="M290 271h120" class="line"/><path d="M290 346h120" class="line"/><path d="M290 421h120" class="line"/><path d="M560 230v25" class="line"/><path d="M560 315v25" class="line"/><path d="M560 400v25" class="line"/><rect x="805" y="115" width="410" height="380" rx="18" class="group"/><text x="825" y="143" class="group-label">交互与通信层</text><rect x="835" y="170" width="350" height="60" rx="13" class="control"/><text x="1010" y="207" text-anchor="middle" class="label">前面板：屏幕 / 触摸 / 按键</text><rect x="835" y="255" width="350" height="60" rx="13" class="control"/><text x="1010" y="292" text-anchor="middle" class="label">USB CDC / Web Serial</text><rect x="835" y="340" width="350" height="60" rx="13" class="control"/><text x="1010" y="377" text-anchor="middle" class="label">Wi-Fi / Web 控制台</text><rect x="835" y="425" width="350" height="60" rx="13" class="box"/><text x="1010" y="462" text-anchor="middle" class="label">日志与诊断快照</text><path d="M710 200h125" class="dashed"/><path d="M710 285h125" class="dashed"/><path d="M710 370h125" class="dashed"/><path d="M710 455h125" class="dashed"/><text x="825" y="535" class="small">蓝色虚线：运行状态向界面、通信和诊断层传播</text></svg>
