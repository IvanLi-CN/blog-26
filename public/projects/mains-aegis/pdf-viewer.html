<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF preview</title>
  <style>
    :root { color-scheme: dark; }
    html, body { min-height: 100%; margin: 0; }
    body { overflow: auto; background: #10231f; }
    #pages { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 1rem; }
    #page-shell { display: grid; place-items: center; min-height: 100%; padding: 1rem; }
    .page { display: block; max-width: 100%; height: auto; background: #fff; box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.25); }
    #toolbar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 0.8rem; padding: 0.55rem; color: #d2e7dd; background: rgba(16, 35, 31, 0.94); font: 13px/1.4 system-ui, sans-serif; }
    #toolbar button { min-width: 2.1rem; border: 1px solid #527568; border-radius: 0.35rem; background: transparent; color: inherit; cursor: pointer; }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #status { display: grid; min-height: 100%; place-items: center; padding: 2rem; color: #b9d7ca; font: 14px/1.5 system-ui, sans-serif; text-align: center; }
    #status[hidden], #pages[hidden], #page-shell[hidden], #toolbar[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="status">正在加载 PDF 预览…</div>
  <div id="toolbar" hidden>
    <button id="previous" type="button" aria-label="上一页">‹</button>
    <span id="page-number">1 / 1</span>
    <button id="next" type="button" aria-label="下一页">›</button>
  </div>
  <main id="page-shell" hidden><canvas id="page" class="page"></canvas></main>
  <main id="pages" hidden></main>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    const params = new URLSearchParams(location.search);
    const file = params.get("file");
    const mode = params.get("mode") === "scroll" ? "scroll" : "page";
    const status = document.getElementById("status");
    const toolbar = document.getElementById("toolbar");
    const pageShell = document.getElementById("page-shell");
    const pageCanvas = document.getElementById("page");
    const pages = document.getElementById("pages");
    const pageNumber = document.getElementById("page-number");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    function notifyHeight() {
      window.parent.postMessage({ type: "project-preview-height", height: document.documentElement.scrollHeight }, "*");
    }

    function viewportFor(page) {
      const base = page.getViewport({ scale: 1 });
      const scale = Math.min(2, Math.max(0.8, (window.innerWidth - 32) / base.width));
      return page.getViewport({ scale });
    }

    async function renderPage(pdf, pageNumber, canvas) {
      const page = await pdf.getPage(pageNumber);
      const viewport = viewportFor(page);
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d", { alpha: false }), viewport }).promise;
      notifyHeight();
    }

    if (!file) {
      status.textContent = "没有指定 PDF 文件。";
    } else {
      try {
        const pdf = await pdfjsLib.getDocument(file).promise;
        if (mode === "scroll") {
          for (let pageIndex = 1; pageIndex <= pdf.numPages; pageIndex += 1) {
            const canvas = document.createElement("canvas");
            canvas.className = "page";
            pages.append(canvas);
            await renderPage(pdf, pageIndex, canvas);
          }
          pages.hidden = false;
        } else {
          let currentPage = 1;
          toolbar.hidden = false;
          pageShell.hidden = false;
          const update = async () => {
            await renderPage(pdf, currentPage, pageCanvas);
            pageNumber.textContent = `${currentPage} / ${pdf.numPages}`;
            previous.disabled = currentPage === 1;
            next.disabled = currentPage === pdf.numPages;
          };
          previous.addEventListener("click", async () => { if (currentPage > 1) { currentPage -= 1; await update(); } });
          next.addEventListener("click", async () => { if (currentPage < pdf.numPages) { currentPage += 1; await update(); } });
          await update();
        }
        status.hidden = true;
        notifyHeight();
      } catch {
        status.textContent = "PDF 预览加载失败，请下载原始文件查看。";
      }
    }
  </script>
</body>
</html>
