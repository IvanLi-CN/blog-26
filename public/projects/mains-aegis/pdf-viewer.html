<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF preview</title>
  <style>
    :root { color-scheme: dark; }
    html, body { min-height: 100%; margin: 0; }
    body { overflow: auto; background: #10231f; }
    #pages { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; padding: 1rem; }
    .page { display: block; max-width: 100%; height: auto; background: #fff; box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.25); }
    #status { display: grid; min-height: 100%; place-items: center; padding: 2rem; color: #b9d7ca; font: 14px/1.5 system-ui, sans-serif; text-align: center; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="status">正在加载 PDF 预览…</div>
  <main id="pages" hidden></main>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    const status = document.getElementById("status");
    const pages = document.getElementById("pages");
    const file = new URLSearchParams(location.search).get("file");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    if (!file) {
      status.textContent = "没有指定 PDF 文件。";
    } else {
      try {
        const pdf = await pdfjsLib.getDocument(file).promise;
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const baseViewport = page.getViewport({ scale: 1 });
          const scale = Math.min(2, Math.max(0.8, (window.innerWidth - 32) / baseViewport.width));
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          canvas.className = "page";
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext("2d", { alpha: false }), viewport }).promise;
          pages.append(canvas);
        }
        pages.hidden = false;
        status.hidden = true;
      } catch {
        status.textContent = "PDF 预览加载失败，请下载原始文件查看。";
      }
    }
  </script>
</body>
</html>
