<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF preview</title>
  <style>
    :root { color-scheme: dark; }
    html, body { min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; overflow: auto; background: #10231f; }
    #page { display: block; max-width: 100%; height: auto; margin: 1rem; background: #fff; box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.25); }
    #status { padding: 2rem; color: #b9d7ca; font: 14px/1.5 system-ui, sans-serif; text-align: center; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="status">正在加载 PDF 预览…</div>
  <canvas id="page" hidden></canvas>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    const status = document.getElementById("status");
    const canvas = document.getElementById("page");
    const file = new URLSearchParams(location.search).get("file");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    if (!file) {
      status.textContent = "没有指定 PDF 文件。";
    } else {
      try {
        const pdf = await pdfjsLib.getDocument(file).promise;
        const page = await pdf.getPage(1);
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = Math.min(2, Math.max(0.8, (window.innerWidth - 32) / baseViewport.width));
        const viewport = page.getViewport({ scale });
        const context = canvas.getContext("2d", { alpha: false });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: context, viewport }).promise;
        canvas.hidden = false;
        status.hidden = true;
      } catch {
        status.textContent = "PDF 预览加载失败，请下载原始文件查看。";
      }
    }
  </script>
</body>
</html>
