name: Recover Release Ledger

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: th/recover-release-ledger
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: RELEASE_ID=e2035ed1ab07a9b26ffd7ec00cbef5e1c22cc8b7fb4887139b58d1ab4ade7808 bun scripts/product-release.ts repair-ledger
        env:
          GH_TOKEN: ${{ github.token }}
