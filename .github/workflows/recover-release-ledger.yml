name: Recover Release Ledger

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release identity to recover
        required: true
        type: string
      operation:
        description: Ledger recovery operation
        required: true
        type: choice
        options:
          - repair-ledger
          - abandon-failed
          - abandon-failed-inputs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun scripts/product-release.ts "$RECOVERY_OPERATION"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
