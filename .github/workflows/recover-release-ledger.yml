name: Recover Release Ledger

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Abandoned failed release identity without frozen products
        required: true
        type: string
      operation:
        description: Ledger recovery operation
        required: true
        type: choice
        options:
          - repair-ledger
          - abandon-failed
          - abandon-failed-inputs

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply ledger recovery operation
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$OPERATION" in
            repair-ledger|abandon-failed|abandon-failed-inputs)
              bun scripts/product-release.ts "$OPERATION"
              ;;
            *)
              echo "Unsupported recovery operation: $OPERATION" >&2
              exit 1
              ;;
          esac
