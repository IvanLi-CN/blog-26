name: Bootstrap Release Ledger Recovery

on:
  workflow_dispatch:
    inputs:
      legacy_sha:
        description: Existing user-authored ledger head to bind with a bot recovery commit
        required: true
        type: string
      release_id:
        description: Optional abandoned release identity to bind to its merged pull request
        required: false
        type: string
      merge_sha:
        description: Optional merged pull request SHA for the abandoned release identity
        required: false
        type: string

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create bot-signed recovery commit
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_SHA: ${{ inputs.legacy_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$LEGACY_SHA" =~ ^[a-f0-9]{40}$ ]]
          HEAD_SHA="$(gh api "repos/${REPOSITORY}/git/ref/heads/release-ledger" --jq '.object.sha')"
          LEDGER_MESSAGE="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.message')"
          LEDGER_DIGEST="$(printf '%s\n' "$LEDGER_MESSAGE" | sed -n 's/^Ledger-Digest: \([a-f0-9]\{64\}\)$/\1/p' | head -1)"
          [[ "$LEDGER_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/${REPOSITORY}/contents/ledger.json?ref=release-ledger" --jq '.content' | tr -d '\n' | base64 --decode > ledger.json
          export HEAD_SHA LEDGER_DIGEST
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { createHash } from "node:crypto";

          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const headSha = process.env.HEAD_SHA;
          const legacySha = process.env.LEGACY_SHA;
          const releaseId = process.env.RELEASE_ID;
          const mergeSha = process.env.MERGE_SHA;
          const ledgerData = JSON.parse(fs.readFileSync("ledger.json", "utf8"));
          const api = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
                "User-Agent": "blog-26-release-ledger-recovery",
              },
            });
            const payload = await response.json();
            if (!response.ok)
              throw new Error(
                `GitHub API request failed (${response.status}): ${JSON.stringify(payload)}`
              );
            return payload;
          };
          const owner = repository.split("/")[0];
          const bot = "github-actions[bot]";
          const legacyCommit = await api(`/repos/${repository}/commits/${legacySha}`);
          if (
            legacyCommit.sha !== legacySha ||
            legacyCommit.author?.login !== owner ||
            legacyCommit.committer?.login !== "web-flow" ||
            legacyCommit.commit?.verification?.verified !== true ||
            legacyCommit.commit?.verification?.reason !== "valid" ||
            !legacyCommit.commit?.message?.includes(`Signed-off-by: ${bot} <`)
          )
            throw new Error(
              "legacy_sha must identify an owner-authored, GitHub-verified ledger recovery candidate"
            );
          const bootstrapSource = JSON.parse(
            fs.readFileSync(".github/release-contract.json", "utf8")
          ).bootstrap.sourceSha;
          let targetFound = false;
          let rootFound = false;
          for (let page = 1; !rootFound; page += 1) {
            const pageCommits = await api(
              `/repos/${repository}/commits?sha=${headSha}&per_page=100&page=${page}`
            );
            if (!Array.isArray(pageCommits) || pageCommits.length === 0) break;
            for (const commit of pageCommits) {
              if (!Array.isArray(commit.parents) || commit.parents.length !== 1)
                throw new Error("Release ledger history is not a single-parent chain");
              if (commit.sha === legacySha) targetFound = true;
              const isRoot =
                typeof commit.commit?.message === "string" &&
                commit.commit.message.includes(`Bootstrap-Source: ${bootstrapSource}`);
              if (isRoot) {
                if (commit.parents[0]?.sha !== bootstrapSource)
                  throw new Error("Release ledger root parent differs from bootstrap");
                rootFound = true;
                break;
              }
            }
          }
          if (!rootFound || !targetFound)
            throw new Error(
              "legacy_sha must be on the root-bound release ledger ancestor chain"
            );
          if (releaseId || mergeSha) {
            if (!releaseId || !mergeSha || !/^[a-f0-9]{40}$/.test(mergeSha))
              throw new Error("release_id and merge_sha must be supplied together");
            const entry = ledgerData.entries.find((item) => item.id === releaseId);
            if (!entry || entry.stage !== "abandoned" || entry.mergeSha || entry.inputs || entry.products)
              throw new Error("Only an abandoned release without frozen artifacts can be rebound");
            entry.mergeSha = mergeSha;
            entry.updatedAt = new Date().toISOString();
          }
          const canonicalJson = (value) => {
            if (Array.isArray(value)) return `[${value.map(canonicalJson).join(",")}]`;
            if (value !== null && typeof value === "object")
              return `{${Object.entries(value).sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0)).map(([key, item]) => `${JSON.stringify(key)}:${canonicalJson(item)}`).join(",")}}`;
            return JSON.stringify(value);
          };
          const canonicalLedger = canonicalJson(ledgerData);
          const ledgerDigest = createHash("sha256").update(canonicalLedger).digest("hex");
          const ledger = Buffer.from(`${canonicalLedger}\n`).toString("base64");
          const input = {
            branch: { repositoryNameWithOwner: repository, branchName: "release-ledger" },
            expectedHeadOid: headSha,
            message: {
              headline: "chore(release): bootstrap ledger recovery",
              body: [
                `Ledger-Digest: ${ledgerDigest}`,
                `Ledger-Recovery: ${legacySha}`,
                "",
                "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>",
              ].join("\n"),
            },
            fileChanges: { additions: [{ path: "ledger.json", contents: ledger }] },
          };
          const response = await fetch("https://api.github.com/graphql", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
              "User-Agent": "blog-26-release-ledger-recovery",
            },
            body: JSON.stringify({
              query:
                "mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables: { input },
            }),
          });
          const payload = await response.json();
          if (!response.ok || payload.errors?.length || !payload.data?.createCommitOnBranch?.commit?.oid) {
            console.error(JSON.stringify(payload));
            process.exit(1);
          }
          console.log(`Created recovery commit ${payload.data.createCommitOnBranch.commit.oid}`);
          NODE
