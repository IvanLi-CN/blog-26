name: Bootstrap Release Ledger Recovery

on:
  workflow_dispatch:
    inputs:
      legacy_sha:
        description: Existing user-authored ledger head to bind with a bot recovery commit
        required: true
        type: string
      release_id:
        description: Optional abandoned release identity to bind to its merged pull request
        required: false
        type: string
      merge_sha:
        description: Optional merged pull request SHA for the abandoned release identity
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate and create bot-signed recovery commit
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_SHA: ${{ inputs.legacy_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bun run - <<'BUN'
          import { assertRecoveryTarget } from "./src/lib/release/github";
          import { assertMerge } from "./src/lib/release/preparation";
          import {
            GitHubLedgerStore,
            GitHubRelease,
            ghTransport,
          } from "./src/lib/release/github";
          import { readContract } from "./src/lib/release/source";
          import { canonicalJson, digestSchema, shaSchema } from "./src/lib/release/policy";
          import { updateRelease } from "./src/lib/release/ledger";

          const contract = readContract();
          if (process.env.REPOSITORY !== contract.repository)
            throw new Error("Recovery repository does not match the release contract");
          const legacySha = shaSchema.parse(process.env.LEGACY_SHA);
          const releaseId = process.env.RELEASE_ID
            ? digestSchema.parse(process.env.RELEASE_ID)
            : undefined;
          const mergeSha = process.env.MERGE_SHA
            ? shaSchema.parse(process.env.MERGE_SHA)
            : undefined;
          if (Boolean(releaseId) !== Boolean(mergeSha))
            throw new Error("release_id and merge_sha must be supplied together");

          const github = new GitHubRelease(
            contract,
            "github-actions",
            ghTransport(process.env.GH_TOKEN)
          );
          const store = new GitHubLedgerStore(github);
          const current = await store.read({ allowLegacyHead: true, allowLegacyAncestor: true });
          assertRecoveryTarget(current.legacySha, legacySha);

          let nextLedger = current.ledger;
          if (releaseId && mergeSha) {
            const entry = current.ledger.entries.find((item) => item.id === releaseId);
            if (
              !entry ||
              entry.stage !== "abandoned" ||
              entry.inputs ||
              entry.products ||
              (entry.mergeSha && entry.mergeSha !== mergeSha)
            )
              throw new Error("Only an abandoned release without frozen artifacts can be rebound");
            if (!entry.prNumber)
              throw new Error("Abandoned release is missing its original PR provenance");
            assertMerge(github, entry, github.pull(entry.prNumber), mergeSha);
            if (!entry.mergeSha) nextLedger = updateRelease(nextLedger, releaseId, { mergeSha });
          }

          if (
            current.recoverySha === legacySha &&
            current.legacySha === legacySha &&
            canonicalJson(nextLedger) === canonicalJson(current.ledger)
          ) {
            console.log(`Recovery already bound at ${current.sha}; no new ledger commit needed`);
            process.exit(0);
          }

          const recoverySha = await store.compareAndSwap(current.sha, nextLedger, legacySha);
          console.log(`Created verified recovery commit ${recoverySha}`);
          BUN
