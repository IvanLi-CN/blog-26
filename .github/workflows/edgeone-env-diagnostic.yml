name: EdgeOne environment diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Inspect Makers environment
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_dir="$(mktemp -d "$RUNNER_TEMP/edgeone-env.XXXXXX")"
          cd "$diagnostic_dir"
          npx edgeone@1.6.33 makers link -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN"
          npx edgeone@1.6.33 makers env ls -t "$EDGEONE_API_TOKEN"
