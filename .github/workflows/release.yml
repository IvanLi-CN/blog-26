name: Release (PR Label Driven)

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Current main head SHA to rerun through the release path
        required: true
        type: string
      pr_number:
        description: Optional merged PR number to use for release labels
        required: false
        type: string

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64
  RELEASE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
  RELEASE_HEAD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_branch }}
  RELEASE_PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      bump_level: ${{ steps.meta.outputs.bump_level }}
      channel: ${{ steps.meta.outputs.channel }}
      intent_type: ${{ steps.meta.outputs.intent_type }}
      pr_number: ${{ steps.meta.outputs.pr_number }}
      pr_url: ${{ steps.meta.outputs.pr_url }}
      is_latest_branch_head: ${{ steps.meta.outputs.is_latest_branch_head }}
      reason: ${{ steps.meta.outputs.reason }}
      frontend_release: ${{ steps.meta.outputs.frontend_release }}
      backend_release: ${{ steps.meta.outputs.backend_release }}
      components: ${{ steps.meta.outputs.components }}
      frontend_release_tag: ${{ steps.meta.outputs.frontend_release_tag }}
      frontend_app_version: ${{ steps.meta.outputs.frontend_app_version }}
      frontend_is_prerelease: ${{ steps.meta.outputs.frontend_is_prerelease }}
      backend_release_tag: ${{ steps.meta.outputs.backend_release_tag }}
      backend_app_version: ${{ steps.meta.outputs.backend_app_version }}
      backend_is_prerelease: ${{ steps.meta.outputs.backend_is_prerelease }}
      image_release_tag: ${{ steps.meta.outputs.image_release_tag }}
      image_app_version: ${{ steps.meta.outputs.image_app_version }}
      image_is_prerelease: ${{ steps.meta.outputs.image_is_prerelease }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      head_branch: ${{ steps.meta.outputs.head_branch }}
    steps:
      - name: Resolve release head sha
        id: release-head
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${RELEASE_HEAD_SHA}"
          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid head_sha: ${target_sha}" >&2
            exit 1
          fi
          echo "release_head_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_REQUESTED_SHA=${target_sha}"
          echo "RELEASE_TARGET_SHA=${target_sha}"

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_HEAD_BRANCH }}

      - name: Resolve release intent from PR labels
        id: intent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_SHA: ${{ env.RELEASE_HEAD_SHA }}
          TARGET_BRANCH: ${{ env.RELEASE_HEAD_BRANCH }}
          PR_NUMBER_OVERRIDE: ${{ env.RELEASE_PR_NUMBER }}
        run: bash ./.github/scripts/release-intent.sh

      - name: Compute frontend release version/tag
        if: ${{ steps.intent.outputs.should_release == 'true' && steps.intent.outputs.frontend_release == 'true' }}
        id: frontend-version
        shell: bash
        env:
          COMPONENT: frontend
          BUMP_LEVEL: ${{ steps.intent.outputs.bump_level }}
          CHANNEL: ${{ steps.intent.outputs.channel }}
          COMMIT_SHA: ${{ env.RELEASE_HEAD_SHA }}
        run: bash ./.github/scripts/compute-version.sh

      - name: Compute backend release version/tag
        if: ${{ steps.intent.outputs.should_release == 'true' && steps.intent.outputs.backend_release == 'true' }}
        id: backend-version
        shell: bash
        env:
          COMPONENT: backend
          BUMP_LEVEL: ${{ steps.intent.outputs.bump_level }}
          CHANNEL: ${{ steps.intent.outputs.channel }}
          COMMIT_SHA: ${{ env.RELEASE_HEAD_SHA }}
        run: bash ./.github/scripts/compute-version.sh

      - name: Compute Docker image version/tag
        if: ${{ steps.intent.outputs.should_release == 'true' && (steps.intent.outputs.frontend_release == 'true' || steps.intent.outputs.backend_release == 'true') }}
        id: image-version
        shell: bash
        env:
          COMPONENT: image
          BUMP_LEVEL: ${{ steps.intent.outputs.bump_level }}
          CHANNEL: ${{ steps.intent.outputs.channel }}
          COMMIT_SHA: ${{ env.RELEASE_HEAD_SHA }}
        run: bash ./.github/scripts/compute-version.sh

      - name: Validate component major alignment
        if: ${{ steps.intent.outputs.should_release == 'true' }}
        shell: bash
        env:
          FRONTEND_RELEASE: ${{ steps.intent.outputs.frontend_release }}
          BACKEND_RELEASE: ${{ steps.intent.outputs.backend_release }}
          FRONTEND_VERSION: ${{ steps.frontend-version.outputs.app_version }}
          BACKEND_VERSION: ${{ steps.backend-version.outputs.app_version }}
        run: |
          set -euo pipefail

          latest_stable_major() {
            local component="$1"
            local tag
            tag="$({ git tag -l "${component}-v*" | grep -E "^${component}-v[0-9]+\.[0-9]+\.[0-9]+$" || true; } | sort -V | tail -n 1)"
            if [[ -n "${tag}" ]]; then
              echo "${tag#${component}-v}" | cut -d. -f1
              return
            fi
            tag="$({ git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
            if [[ -n "${tag}" ]]; then
              echo "${tag#v}" | cut -d. -f1
              return
            fi
            node -e "const p=require('./package.json'); process.stdout.write(String((p.version||'0.0.0').split('.')[0]||'0'))"
          }

          extract_major() {
            local version="$1"
            echo "${version%%-*}" | cut -d. -f1
          }

          if [[ "${FRONTEND_RELEASE}" == "true" && "${BACKEND_RELEASE}" == "true" ]]; then
            frontend_major="$(extract_major "${FRONTEND_VERSION}")"
            backend_major="$(extract_major "${BACKEND_VERSION}")"
            if [[ "${frontend_major}" != "${backend_major}" ]]; then
              echo "frontend major (${frontend_major}) does not match backend major (${backend_major})" >&2
              exit 1
            fi
            exit 0
          fi

          if [[ "${FRONTEND_RELEASE}" == "true" ]]; then
            frontend_major="$(extract_major "${FRONTEND_VERSION}")"
            backend_major="$(latest_stable_major backend)"
            if [[ "${frontend_major}" != "${backend_major}" ]]; then
              echo "frontend major (${frontend_major}) does not match latest backend major (${backend_major})" >&2
              exit 1
            fi
          fi

          if [[ "${BACKEND_RELEASE}" == "true" ]]; then
            backend_major="$(extract_major "${BACKEND_VERSION}")"
            frontend_major="$(latest_stable_major frontend)"
            if [[ "${backend_major}" != "${frontend_major}" ]]; then
              echo "backend major (${backend_major}) does not match latest frontend major (${frontend_major})" >&2
              exit 1
            fi
          fi

      - name: Configure Git user
        if: ${{ steps.intent.outputs.should_release == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Recheck current main head before frontend tag
        if: ${{ steps.intent.outputs.should_release == 'true' && steps.intent.outputs.frontend_release == 'true' }}
        id: main-head-before-frontend-tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = "${{ env.RELEASE_HEAD_SHA }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`main-head check: expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");
            if (!isCurrentHead) core.setFailed("Release source is no longer the current main head");

      - name: Create and push frontend tag (if missing)
        if: ${{ steps.intent.outputs.should_release == 'true' && steps.intent.outputs.frontend_release == 'true' && steps.main-head-before-frontend-tag.outputs.is_current_head == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.frontend-version.outputs.release_tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Skip creating."
            exit 0
          fi
          git tag -a "${tag}" "${{ env.RELEASE_HEAD_SHA }}" -m "${tag}"
          git push origin "${tag}"

      - name: Recheck current main head before backend tag
        if: ${{ steps.intent.outputs.should_release == 'true' && steps.intent.outputs.backend_release == 'true' }}
        id: main-head-before-backend-tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = "${{ env.RELEASE_HEAD_SHA }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`main-head check: expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");
            if (!isCurrentHead) core.setFailed("Release source is no longer the current main head");

      - name: Create and push backend tag (if missing)
        if: ${{ steps.intent.outputs.should_release == 'true' && steps.intent.outputs.backend_release == 'true' && steps.main-head-before-backend-tag.outputs.is_current_head == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.backend-version.outputs.release_tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Skip creating."
            exit 0
          fi
          git tag -a "${tag}" "${{ env.RELEASE_HEAD_SHA }}" -m "${tag}"
          git push origin "${tag}"

      - name: Recheck current main head before image tag
        if: ${{ steps.intent.outputs.should_release == 'true' && (steps.intent.outputs.frontend_release == 'true' || steps.intent.outputs.backend_release == 'true') }}
        id: main-head-before-image-tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = "${{ env.RELEASE_HEAD_SHA }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`main-head check: expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");
            if (!isCurrentHead) core.setFailed("Release source is no longer the current main head");

      - name: Create and push Docker image tag (if missing)
        if: ${{ steps.intent.outputs.should_release == 'true' && (steps.intent.outputs.frontend_release == 'true' || steps.intent.outputs.backend_release == 'true') && steps.main-head-before-image-tag.outputs.is_current_head == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.image-version.outputs.release_tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists. Skip creating."
            exit 0
          fi
          git tag -a "${tag}" "${{ env.RELEASE_HEAD_SHA }}" -m "${tag}"
          git push origin "${tag}"

      - name: Export metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "head_sha=${{ env.RELEASE_HEAD_SHA }}" >> "$GITHUB_OUTPUT"
          echo "head_branch=${{ env.RELEASE_HEAD_BRANCH }}" >> "$GITHUB_OUTPUT"
          echo "should_release=${{ steps.intent.outputs.should_release }}" >> "$GITHUB_OUTPUT"
          echo "bump_level=${{ steps.intent.outputs.bump_level }}" >> "$GITHUB_OUTPUT"
          echo "channel=${{ steps.intent.outputs.channel }}" >> "$GITHUB_OUTPUT"
          echo "intent_type=${{ steps.intent.outputs.intent_type }}" >> "$GITHUB_OUTPUT"
          echo "frontend_release=${{ steps.intent.outputs.frontend_release }}" >> "$GITHUB_OUTPUT"
          echo "backend_release=${{ steps.intent.outputs.backend_release }}" >> "$GITHUB_OUTPUT"
          echo "components=${{ steps.intent.outputs.components }}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ steps.intent.outputs.pr_number }}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${{ steps.intent.outputs.pr_url }}" >> "$GITHUB_OUTPUT"
          echo "is_latest_branch_head=${{ steps.intent.outputs.is_latest_branch_head }}" >> "$GITHUB_OUTPUT"
          echo "reason=${{ steps.intent.outputs.reason }}" >> "$GITHUB_OUTPUT"
          echo "frontend_release_tag=${{ steps.frontend-version.outputs.release_tag || '' }}" >> "$GITHUB_OUTPUT"
          echo "frontend_app_version=${{ steps.frontend-version.outputs.app_version || '' }}" >> "$GITHUB_OUTPUT"
          echo "frontend_is_prerelease=${{ steps.frontend-version.outputs.is_prerelease || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "backend_release_tag=${{ steps.backend-version.outputs.release_tag || '' }}" >> "$GITHUB_OUTPUT"
          echo "backend_app_version=${{ steps.backend-version.outputs.app_version || '' }}" >> "$GITHUB_OUTPUT"
          echo "backend_is_prerelease=${{ steps.backend-version.outputs.is_prerelease || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "image_release_tag=${{ steps.image-version.outputs.release_tag || '' }}" >> "$GITHUB_OUTPUT"
          echo "image_app_version=${{ steps.image-version.outputs.app_version || '' }}" >> "$GITHUB_OUTPUT"
          echo "image_is_prerelease=${{ steps.image-version.outputs.is_prerelease || 'false' }}" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release intent result"
            echo "- head_sha: \`${{ env.RELEASE_HEAD_SHA }}\`"
            echo "- pr_number: \`${{ steps.intent.outputs.pr_number || 'n/a' }}\`"
            echo "- intent_type: \`${{ steps.intent.outputs.intent_type || 'n/a' }}\`"
            echo "- channel: \`${{ steps.intent.outputs.channel || 'n/a' }}\`"
            echo "- components: \`${{ steps.intent.outputs.components || 'n/a' }}\`"
            echo "- should_release: \`${{ steps.intent.outputs.should_release }}\`"
            echo "- frontend_release_tag: \`${{ steps.frontend-version.outputs.release_tag || 'n/a' }}\`"
            echo "- backend_release_tag: \`${{ steps.backend-version.outputs.release_tag || 'n/a' }}\`"
            echo "- image_release_tag: \`${{ steps.image-version.outputs.release_tag || 'n/a' }}\`"
            echo "- reason: \`${{ steps.intent.outputs.reason }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_frontend:
    name: Publish frontend release + EdgeOne artifact
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.frontend_release == 'true' }}
    outputs:
      public_media_packaged_count: ${{ steps.package-public-media.outputs.public_media_packaged_count }}
      public_media_packaged_bytes: ${{ steps.package-public-media.outputs.public_media_packaged_bytes }}
      public_media_external_count: ${{ steps.package-public-media.outputs.public_media_external_count }}
      public_media_artifact_files: ${{ steps.verify-public-media.outputs.public_media_artifact_files }}
      public_media_artifact_bytes: ${{ steps.verify-public-media.outputs.public_media_artifact_bytes }}
    permissions:
      contents: write
    steps:
      - name: Checkout workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Cache Bun & deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch content bundle
        env:
          PUBLIC_CONTENT_BUNDLE_URL: ${{ secrets.PUBLIC_CONTENT_BUNDLE_URL }}
          PUBLIC_SNAPSHOT_PATH: ./site/generated/public-snapshot.json
        run: bash ./scripts/fetch-public-content-bundle.sh

      - name: Resolve frontend API base URL
        shell: bash
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          api_base="${PUBLIC_API_BASE_URL:-}"
          if [[ -z "${api_base}" ]]; then
            echo "PUBLIC_API_BASE_URL is required for frontend releases" >&2
            exit 1
          fi
          echo "PUBLIC_API_BASE_URL=${api_base}" >> "$GITHUB_ENV"

      - name: Resolve frontend site config
        shell: bash
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SITE_BASE_PATH: ${{ vars.PUBLIC_SITE_BASE_PATH }}
        run: |
          set -euo pipefail
          trim() {
            local value="${1:-}"
            printf '%s' "${value}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          repo_name="${GITHUB_REPOSITORY#*/}"
          legacy_project_url="https://ivanli-cn.github.io/${repo_name}"
          legacy_project_base="/${repo_name}"

          custom_domain=""
          if [[ -f "./public/CNAME" ]]; then
            custom_domain="$(trim "$(head -n 1 ./public/CNAME || true)")"
          fi

          default_site_url=""
          if [[ -n "${custom_domain}" ]]; then
            default_site_url="https://${custom_domain}"
          fi

          site_url="$(trim "${PUBLIC_SITE_URL:-${default_site_url}}")"
          site_base_path="$(trim "${PUBLIC_SITE_BASE_PATH:-}")"

          if [[ -n "${custom_domain}" ]]; then
            if [[ -z "${site_url}" || "${site_url}" == "${legacy_project_url}" ]]; then
              site_url="${default_site_url}"
            fi
            if [[ -z "${site_base_path}" || "${site_base_path}" == "${legacy_project_base}" ]]; then
              site_base_path="/"
            fi
          fi

          if [[ -z "${site_url}" ]]; then
            echo "PUBLIC_SITE_URL is required for frontend releases" >&2
            exit 1
          fi
          if [[ -z "${site_base_path}" ]]; then
            echo "PUBLIC_SITE_BASE_PATH is required for frontend releases" >&2
            exit 1
          fi
          echo "PUBLIC_SITE_URL=${site_url}" >> "$GITHUB_ENV"
          echo "PUBLIC_SITE_BASE_PATH=${site_base_path}" >> "$GITHUB_ENV"

      - name: Build frontend static site
        env:
          PUBLIC_CONTENT_BUNDLE_URL: ${{ secrets.PUBLIC_CONTENT_BUNDLE_URL }}
          PUBLIC_SNAPSHOT_PATH: ./site/generated/public-snapshot.json
        run: bun run frontend:build

      - name: Verify frontend static output
        env:
          PUBLIC_API_BASE_URL: ${{ env.PUBLIC_API_BASE_URL }}
          PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
          PUBLIC_SITE_BASE_PATH: ${{ env.PUBLIC_SITE_BASE_PATH }}
        run: bun ./scripts/verify-pages-build.ts

      - name: Package referenced public media
        id: package-public-media
        env:
          PUBLIC_STATIC_MEDIA_ORIGIN: ${{ vars.PUBLIC_STATIC_MEDIA_ORIGIN || 'https://api.ivanli.cc' }}
          PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
          PUBLIC_SITE_BASE_PATH: ${{ env.PUBLIC_SITE_BASE_PATH }}
          PUBLIC_STATIC_MEDIA_MAX_BYTES: 20971520
          PUBLIC_STATIC_MEDIA_MAX_FILES: 20000
          PUBLIC_STATIC_MEDIA_MAX_PROJECT_BYTES: 5368709120
        run: bun run frontend:package-media

      - name: Package frontend release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.frontend_app_version }}"
          mkdir -p release-assets/frontend
          tar -C site-dist -czf "release-assets/frontend/frontend-site-dist-${version}.tar.gz" .
          sha256sum "release-assets/frontend/frontend-site-dist-${version}.tar.gz" > "release-assets/frontend/frontend-sha256-${version}.txt"

      - name: Stage EdgeOne deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./edgeone-dist
          mkdir -p ./edgeone-dist
          cp -R ./site-dist/. ./edgeone-dist/
          cp -R ./edge-functions ./edgeone-dist/edge-functions

      - name: Verify EdgeOne deployment artifact
        id: verify-public-media
        env:
          PUBLIC_STATIC_MEDIA_ORIGIN: ${{ vars.PUBLIC_STATIC_MEDIA_ORIGIN || 'https://api.ivanli.cc' }}
          PUBLIC_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
          PUBLIC_SITE_BASE_PATH: ${{ env.PUBLIC_SITE_BASE_PATH }}
          PUBLIC_STATIC_MEDIA_MAX_FILES: 20000
          PUBLIC_STATIC_MEDIA_MAX_PROJECT_BYTES: 5368709120
        run: bun run frontend:verify-media

      - name: Record public media artifact summary
        shell: bash
        run: |
          {
            echo "### EdgeOne artifact"
            echo "- files: \`${{ steps.verify-public-media.outputs.public_media_artifact_files }}\`"
            echo "- bytes: \`${{ steps.verify-public-media.outputs.public_media_artifact_bytes }}\`"
            echo "- packaged media: \`${{ steps.package-public-media.outputs.public_media_packaged_count }}\` files"
            echo "- external media exceptions: \`${{ steps.package-public-media.outputs.public_media_external_count }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload frontend EdgeOne artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-edgeone-site
          path: ./edgeone-dist
          if-no-files-found: error
          include-hidden-files: true

      - name: Recheck current main head before frontend GitHub Release
        id: main-head-before-frontend-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = "${{ needs.prepare.outputs.head_sha }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`main-head check: expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");
            if (!isCurrentHead) core.setFailed("Release source is no longer the current main head");

      - name: Create or update frontend GitHub Release
        if: ${{ steps.main-head-before-frontend-release.outputs.is_current_head == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.prepare.outputs.frontend_release_tag }}
          name: ${{ needs.prepare.outputs.frontend_release_tag }}
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: ${{ needs.prepare.outputs.frontend_is_prerelease }}
          artifacts: |
            release-assets/frontend/frontend-site-dist-${{ needs.prepare.outputs.frontend_app_version }}.tar.gz
            release-assets/frontend/frontend-sha256-${{ needs.prepare.outputs.frontend_app_version }}.txt

  deploy_frontend_edgeone:
    name: Deploy frontend to EdgeOne Makers
    runs-on: ubuntu-latest
    needs: [prepare, publish_frontend]
    if: ${{ needs.publish_frontend.result == 'success' && needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.is_latest_branch_head == 'true' }}
    outputs:
      edgeone_status: ${{ steps.edgeone-status.outputs.edgeone_status }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0

      - name: Download frontend EdgeOne artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-edgeone-site
          path: ./edgeone-dist

      - name: Stage EdgeOne artifact outside repository
        shell: bash
        run: |
          set -euo pipefail
          edgeone_artifact_dir="$(mktemp -d "$RUNNER_TEMP/edgeone-site.XXXXXX")"
          cp -R ./edgeone-dist/. "$edgeone_artifact_dir/"
          echo "EDGEONE_ARTIFACT_DIR=$edgeone_artifact_dir" >> "$GITHUB_ENV"

      - name: Recheck current main head before EdgeOne deployment
        id: main-head-before-edgeone-deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = "${{ needs.prepare.outputs.head_sha }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`main-head check: expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");
            if (!isCurrentHead) core.setFailed("Release source is no longer the current main head");

      - name: Configure EdgeOne Makers backend origin
        if: ${{ steps.main-head-before-edgeone-deployment.outputs.is_current_head == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          environment_log="$RUNNER_TEMP/edgeone-environment.log"
          environment_dir="$(mktemp -d "$RUNNER_TEMP/edgeone-environment.XXXXXX")"
          if ! (
            cd "$environment_dir"
            npx edgeone@1.6.33 makers link -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN"
            npx edgeone@1.6.33 makers env set BLOG_BACKEND_ORIGIN https://api.ivanli.cc -t "$EDGEONE_API_TOKEN"
          ) >"$environment_log" 2>&1; then
            sed -E '/Deploy URL:/d; s/(eo_token=)[^&[:space:]]+/\1[REDACTED]/g; s/(eo_time=)[^&[:space:]]+/\1[REDACTED]/g' "$environment_log"
            exit 1
          fi
          sed -E '/Deploy URL:/d; s/(eo_token=)[^&[:space:]]+/\1[REDACTED]/g; s/(eo_time=)[^&[:space:]]+/\1[REDACTED]/g' "$environment_log"

      - name: Deploy to EdgeOne Makers
        id: deployment
        if: ${{ steps.main-head-before-edgeone-deployment.outputs.is_current_head == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          deployment_log="$RUNNER_TEMP/edgeone-deploy.log"
          if ! npx edgeone@1.6.33 makers deploy "$EDGEONE_ARTIFACT_DIR" -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN" -e production >"$deployment_log" 2>&1; then
            sed -E '/Deploy URL:/d; s/(eo_token=)[^&[:space:]]+/\1[REDACTED]/g; s/(eo_time=)[^&[:space:]]+/\1[REDACTED]/g' "$deployment_log"
            exit 1
          fi
          sed -E '/Deploy URL:/d; s/(eo_token=)[^&[:space:]]+/\1[REDACTED]/g; s/(eo_time=)[^&[:space:]]+/\1[REDACTED]/g' "$deployment_log"

      - name: Record EdgeOne receipt status
        id: edgeone-status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="failed"
          if [[ "${{ steps.deployment.outcome || '' }}" == "success" ]]; then
            status="deployed"
          elif [[ "${{ steps.main-head-before-edgeone-deployment.outputs.is_current_head || 'false' }}" != "true" ]]; then
            status="skipped_recheck_head_moved"
          fi
          echo "edgeone_status=${status}" >> "$GITHUB_OUTPUT"

  publish_image:
    name: Publish unified Docker image
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ needs.prepare.outputs.should_release == 'true' && (needs.prepare.outputs.frontend_release == 'true' || needs.prepare.outputs.backend_release == 'true') }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - name: Checkout workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Fetch content bundle
        env:
          PUBLIC_CONTENT_BUNDLE_URL: ${{ secrets.PUBLIC_CONTENT_BUNDLE_URL }}
          PUBLIC_SNAPSHOT_PATH: ./site/generated/public-snapshot.json
        run: bash ./scripts/fetch-public-content-bundle.sh

      - name: Resolve Docker public site config
        id: public-site-config
        shell: bash
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SITE_BASE_PATH: ${{ vars.PUBLIC_SITE_BASE_PATH }}
        run: |
          set -euo pipefail
          trim() {
            local value="${1:-}"
            printf '%s' "${value}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }

          api_base="$(trim "${PUBLIC_API_BASE_URL:-}")"
          if [[ -z "${api_base}" ]]; then
            echo "PUBLIC_API_BASE_URL is required for Docker image releases" >&2
            exit 1
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          legacy_project_url="https://ivanli-cn.github.io/${repo_name}"
          legacy_project_base="/${repo_name}"

          custom_domain=""
          if [[ -f "./public/CNAME" ]]; then
            custom_domain="$(trim "$(head -n 1 ./public/CNAME || true)")"
          fi

          default_site_url=""
          if [[ -n "${custom_domain}" ]]; then
            default_site_url="https://${custom_domain}"
          fi

          site_url="$(trim "${PUBLIC_SITE_URL:-${default_site_url}}")"
          site_base_path="$(trim "${PUBLIC_SITE_BASE_PATH:-}")"

          if [[ -n "${custom_domain}" ]]; then
            if [[ -z "${site_url}" || "${site_url}" == "${legacy_project_url}" ]]; then
              site_url="${default_site_url}"
            fi
            if [[ -z "${site_base_path}" || "${site_base_path}" == "${legacy_project_base}" ]]; then
              site_base_path="/"
            fi
          fi

          if [[ -z "${site_url}" ]]; then
            echo "PUBLIC_SITE_URL is required for Docker image releases" >&2
            exit 1
          fi
          if [[ -z "${site_base_path}" ]]; then
            echo "PUBLIC_SITE_BASE_PATH is required for Docker image releases" >&2
            exit 1
          fi

          echo "api_base=${api_base}" >> "$GITHUB_OUTPUT"
          echo "site_url=${site_url}" >> "$GITHUB_OUTPUT"
          echo "site_base_path=${site_base_path}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image name
        id: image-name
        shell: bash
        run: |
          set -euo pipefail
          lower="${GITHUB_REPOSITORY,,}"
          echo "image_name_lower=${lower}" >> "$GITHUB_OUTPUT"

      - name: Re-check branch head before pushing latest
        id: latest-head
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = "${{ needs.prepare.outputs.head_branch }}";
            const expectedSha = "${{ needs.prepare.outputs.head_sha }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${branch}`,
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`latest-head check: branch=${branch} expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");

      - name: Compute Docker tags by channel
        id: docker-tags
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name_lower }}"
          release_tag="${{ needs.prepare.outputs.image_release_tag }}"
          channel="${{ needs.prepare.outputs.channel }}"
          is_latest_branch_head="${{ needs.prepare.outputs.is_latest_branch_head }}"
          is_current_head="${{ steps.latest-head.outputs.is_current_head }}"

          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${release_tag}"
            if [[ "${channel}" == "stable" && "${is_latest_branch_head}" == "true" && "${is_current_head}" == "true" ]]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Gather git metadata
        id: git-info
        shell: bash
        run: |
          set -euo pipefail
          echo "commit_hash=${{ needs.prepare.outputs.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "commit_short_hash=$(echo '${{ needs.prepare.outputs.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "repository_url=https://github.com/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${{ needs.prepare.outputs.head_branch }}" >> "$GITHUB_OUTPUT"
          echo "branch_url=https://github.com/${{ github.repository }}/tree/${{ needs.prepare.outputs.head_branch }}" >> "$GITHUB_OUTPUT"

      - name: Read drizzle-orm version from package.json
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          ver=$(node -e "const p=require('./package.json'); const v=(p.dependencies&&p.dependencies['drizzle-orm'])||(p.devDependencies&&p.devDependencies['drizzle-orm'])||''; process.stdout.write(String(v||'').replace(/^\\D+/,''));")
          echo "drizzle_version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Recheck current main head before image publication
        id: main-head-before-image-publication
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = "${{ needs.prepare.outputs.head_sha }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`main-head check: expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");
            if (!isCurrentHead) core.setFailed("Release source is no longer the current main head");

      - name: Build and push unified Docker image
        if: ${{ steps.main-head-before-image-publication.outputs.is_current_head == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app-image-built
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_app_version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ needs.prepare.outputs.image_release_tag }}
          build-args: |
            BUILD_DATE=${{ steps.git-info.outputs.build_date }}
            COMMIT_HASH=${{ steps.git-info.outputs.commit_hash }}
            COMMIT_SHORT_HASH=${{ steps.git-info.outputs.commit_short_hash }}
            REPOSITORY_URL=${{ steps.git-info.outputs.repository_url }}
            BRANCH_NAME=${{ steps.git-info.outputs.branch_name }}
            BRANCH_URL=${{ steps.git-info.outputs.branch_url }}
            PUBLIC_API_BASE_URL=${{ steps.public-site-config.outputs.api_base }}
            PUBLIC_SITE_URL=${{ steps.public-site-config.outputs.site_url }}
            PUBLIC_SITE_BASE_PATH=${{ steps.public-site-config.outputs.site_base_path }}
            PUBLIC_CONTENT_BUNDLE_URL=preloaded
            WITH_PLAYWRIGHT=false
            DRIZZLE_ORM_VERSION=${{ steps.pkg.outputs.drizzle_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_backend:
    name: Publish backend release artifacts
    runs-on: ubuntu-latest
    needs: [prepare]
    if: ${{ needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.backend_release == 'true' }}
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Cache Bun & deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build backend runtime + admin artifacts
        run: bun run backend:build

      - name: Package backend release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.backend_app_version }}"
          mkdir -p release-assets/backend
          tar -C backend-dist -czf "release-assets/backend/backend-runtime-dist-${version}.tar.gz" .
          tar -C admin-dist -czf "release-assets/backend/backend-admin-dist-${version}.tar.gz" .
          sha256sum \
            "release-assets/backend/backend-runtime-dist-${version}.tar.gz" \
            "release-assets/backend/backend-admin-dist-${version}.tar.gz" \
            > "release-assets/backend/backend-sha256-${version}.txt"

      - name: Recheck current main head before backend GitHub Release
        id: main-head-before-backend-release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const expectedSha = "${{ needs.prepare.outputs.head_sha }}";
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const currentSha = data?.object?.sha ?? "";
            const isCurrentHead = currentSha === expectedSha;
            core.info(`main-head check: expected=${expectedSha} current=${currentSha} isCurrent=${isCurrentHead}`);
            core.setOutput("is_current_head", isCurrentHead ? "true" : "false");
            if (!isCurrentHead) core.setFailed("Release source is no longer the current main head");

      - name: Create or update backend GitHub Release
        if: ${{ steps.main-head-before-backend-release.outputs.is_current_head == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.prepare.outputs.backend_release_tag }}
          name: ${{ needs.prepare.outputs.backend_release_tag }}
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: ${{ needs.prepare.outputs.backend_is_prerelease }}
          artifacts: |
            release-assets/backend/backend-runtime-dist-${{ needs.prepare.outputs.backend_app_version }}.tar.gz
            release-assets/backend/backend-admin-dist-${{ needs.prepare.outputs.backend_app_version }}.tar.gz
            release-assets/backend/backend-sha256-${{ needs.prepare.outputs.backend_app_version }}.txt

  comment_release_receipt:
    name: Comment PR release receipt
    runs-on: ubuntu-latest
    needs: [prepare, publish_frontend, deploy_frontend_edgeone, publish_image, publish_backend]
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Upsert managed PR release receipt comment
        id: receipt
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_URL: ${{ needs.prepare.outputs.pr_url }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          INTENT_TYPE: ${{ needs.prepare.outputs.intent_type }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          FRONTEND_RELEASE: ${{ needs.prepare.outputs.frontend_release }}
          BACKEND_RELEASE: ${{ needs.prepare.outputs.backend_release }}
          FRONTEND_RELEASE_TAG: ${{ needs.prepare.outputs.frontend_release_tag }}
          BACKEND_RELEASE_TAG: ${{ needs.prepare.outputs.backend_release_tag }}
          IMAGE_RELEASE_TAG: ${{ needs.prepare.outputs.image_release_tag }}
          IS_LATEST_BRANCH_HEAD: ${{ needs.prepare.outputs.is_latest_branch_head }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLISH_FRONTEND_RESULT: ${{ needs.publish_frontend.result }}
          PUBLISH_BACKEND_RESULT: ${{ needs.publish_backend.result }}
          PUBLISH_IMAGE_RESULT: ${{ needs.publish_image.result }}
          DEPLOY_FRONTEND_EDGEONE_RESULT: ${{ needs.deploy_frontend_edgeone.result }}
          EDGEONE_STATUS: ${{ needs.deploy_frontend_edgeone.outputs.edgeone_status || (needs.prepare.outputs.frontend_release == 'true' && needs.prepare.outputs.channel != 'stable' && 'skipped_prerelease') || (needs.prepare.outputs.frontend_release == 'true' && needs.prepare.outputs.is_latest_branch_head != 'true' && 'skipped_initial_non_head') || '' }}
          PUBLIC_MEDIA_PACKAGED_COUNT: ${{ needs.publish_frontend.outputs.public_media_packaged_count || '0' }}
          PUBLIC_MEDIA_PACKAGED_BYTES: ${{ needs.publish_frontend.outputs.public_media_packaged_bytes || '0' }}
          PUBLIC_MEDIA_EXTERNAL_COUNT: ${{ needs.publish_frontend.outputs.public_media_external_count || '0' }}
          PUBLIC_MEDIA_ARTIFACT_FILES: ${{ needs.publish_frontend.outputs.public_media_artifact_files || '0' }}
          PUBLIC_MEDIA_ARTIFACT_BYTES: ${{ needs.publish_frontend.outputs.public_media_artifact_bytes || '0' }}
        run: bash ./.github/scripts/release-receipt.sh

      - name: Write receipt summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Release receipt comment"
            echo "- action: \`${{ steps.receipt.outputs.receipt_action || 'unknown' }}\`"
            echo "- reason: \`${{ steps.receipt.outputs.receipt_reason || 'unknown' }}\`"
            echo "- comment_id: \`${{ steps.receipt.outputs.receipt_comment_id || 'n/a' }}\`"
            echo "- comment_url: ${{ steps.receipt.outputs.receipt_comment_url || 'n/a' }}"
            echo "- duplicate_cleanup_count: \`${{ steps.receipt.outputs.duplicate_cleanup_count || '0' }}\`"
            echo "- blocking_release: \`false\`"
          } >> "${GITHUB_STEP_SUMMARY}"
