name: Release Merge Followup
on:
  workflow_run:
    workflows: [CI/CD Pipeline, E2E Tests]
    types: [completed]
    branches: ['th/release-*']
permissions:
  contents: read
jobs:
  followup:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-merge-followup
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify registered PR gates, observe protected auto-merge and dispatch exact-main checks
        run: bun scripts/product-release.ts followup
        env:
          GH_TOKEN: ${{ github.token }}
