name: Release Merge Followup
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Registered release identity
        required: true
        type: string
      pr_number:
        description: Prepared release pull request number
        required: true
        type: string
      head_sha:
        description: Exact prepared release head
        required: true
        type: string
permissions:
  contents: read
jobs:
  followup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: release-merge-followup
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify registered PR gates, publish protected checks and observe auto-merge
        run: bun scripts/product-release.ts followup
        env:
          GH_TOKEN: ${{ github.token }}
