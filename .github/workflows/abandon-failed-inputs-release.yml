name: Abandon Failed Product Release Inputs

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Failed or cancelled release identity whose frozen input artifact is unavailable
        required: true
        type: string
      confirm_loss:
        description: Confirm that the original frozen inputs cannot be recovered
        required: true
        type: boolean
      incident_reason:
        description: Incident reason for permanently abandoning the release identity
        required: true
        type: string

permissions:
  contents: read

jobs:
  abandon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Abandon only after frozen input loss is confirmed
        run: bun scripts/product-release.ts abandon-failed-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_CONFIRM_LOSS: ${{ inputs.confirm_loss }}
          RELEASE_INCIDENT_REASON: ${{ inputs.incident_reason }}
