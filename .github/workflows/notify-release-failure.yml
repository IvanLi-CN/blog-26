name: Notify failed release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Manual Product Release, Product Release]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  failure_identity:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.path == '.github/workflows/manual-product-release.yml' ||
       github.event.workflow_run.path == '.github/workflows/product-release.yml')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      confirmed: ${{ steps.identity.outputs.confirmed }}
      version: ${{ steps.identity.outputs.version }}
      source: ${{ steps.identity.outputs.source }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      merge_sha: ${{ steps.identity.outputs.merge_sha }}
      identity: ${{ steps.identity.outputs.identity }}
      run_url: ${{ steps.identity.outputs.run_url }}
      attempt: ${{ steps.identity.outputs.attempt }}
      phase: ${{ steps.identity.outputs.phase }}
      step: ${{ steps.identity.outputs.step }}
      recovery: ${{ steps.identity.outputs.recovery }}
      recovery_url: ${{ steps.identity.outputs.recovery_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: identity
        run: bun scripts/product-release.ts notification
        env:
          GH_TOKEN: ${{ github.token }}
  release_failure:
    needs: failure_identity
    if: needs.failure_identity.outputs.confirmed == 'true'
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@00bbb56c1853eed577652f69678a0419c468e969
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: |
        status: product release failed
        workflow: ${{ github.event.workflow_run.name }}
        product version: ${{ needs.failure_identity.outputs.version }}
        source: ${{ needs.failure_identity.outputs.source }}
        source sha: ${{ needs.failure_identity.outputs.source_sha }}
        merge sha: ${{ needs.failure_identity.outputs.merge_sha }}
        identity: ${{ needs.failure_identity.outputs.identity }}
        attempt: ${{ needs.failure_identity.outputs.attempt }}
        phase: ${{ needs.failure_identity.outputs.phase }}
        step: ${{ needs.failure_identity.outputs.step }}
        recovery: ${{ needs.failure_identity.outputs.recovery }}
        url: ${{ needs.failure_identity.outputs.run_url }}
        recovery url: ${{ needs.failure_identity.outputs.recovery_url }}
        note: Use the same-identity retry target. Frozen-input abandon is rejected while its artifact is available; emergency abandon requires confirmed artifact loss and an incident reason.
  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@00bbb56c1853eed577652f69678a0419c468e969
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: |
        status: smoke test
        workflow: Notify failed release
        event: workflow_dispatch
        branch: ${{ github.ref_name }}
        sha: ${{ github.sha }}
        attempt: ${{ github.run_attempt }}
        actor: ${{ github.actor }}
        url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        note: manual notifier smoke test
