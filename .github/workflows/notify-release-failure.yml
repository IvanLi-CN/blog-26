name: Notify failed release

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@00bbb56c1853eed577652f69678a0419c468e969
    with:
      outcome: failure
      on_gateway_failure: warn
      summary: |
        status: smoke test
        workflow: Notify failed release
        event: workflow_dispatch
        branch: ${{ github.ref_name }}
        sha: ${{ github.sha }}
        attempt: ${{ github.run_attempt }}
        actor: ${{ github.actor }}
        url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        note: manual notifier smoke test
