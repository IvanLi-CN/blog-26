name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - th/site-knowledge-assistant
  release:
    types: [ published ]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      export_runtime_bundle:
        description: Export this exact verified native runtime bundle for local packaging
        type: boolean
        default: false
      performance_probe:
        description: Measure the complete CI workload without the independent release-version matrix
        type: boolean
        default: false
      project_media_cache_proof:
        description: Run isolated media cold/warm and Docker invalidation experiments
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-push-{1}', github.workflow, github.run_id) }}
  # Keep PR churn fast while preserving every push run for workflow_run release triggering.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal default permissions for all jobs on GitHub Actions
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64

jobs:
  frozen-product-smoke:
    name: Frozen Product Smoke (${{ matrix.version }})
    if: github.event_name == 'workflow_dispatch' && !inputs.project_media_cache_proof && !inputs.performance_probe && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/th/release-')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['2.8.0', '2.8.0-alpha.1', '2.8.0-beta.1', '2.8.0-rc.1+Candidate.001']
    env:
      DB_PATH: ./test-data/sqlite.db
      LOCAL_CONTENT_BASE_PATH: ./test-data/local
      CONTENT_SOURCES: local
      PUBLIC_API_BASE_URL: https://console.ivanli.cc
      PUBLIC_SITE_URL: https://ivanli.cc
      PUBLIC_SITE_BASE_PATH: /
      PUBLIC_ASSISTANT_LAUNCHER_DEFAULT: "true"
      PRODUCT_RELEASE_FIXTURE_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@v4
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Prepare non-production public data
        run: bun run test-env:reset-fs-only && bun run public:export
      - name: Exercise the frozen two-product build and production runtime
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          bun tests/ci/prepare-release-fixture.ts
          RUSTUP_TOOLCHAIN=1.91.0 bun scripts/product-release.ts build-products
          bun scripts/smoke-product-release.ts
      - name: Save candidate identity and product digest evidence
        uses: actions/upload-artifact@v7
        with:
          name: candidate-product-proof-${{ github.sha }}-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/product-release/products/release-manifest.json
            ${{ runner.temp }}/product-release/products/artifact-manifest.json
          retention-days: 90
          if-no-files-found: error

  release-policy:
    name: Release Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Validate semantic evidence and registered VERSION-only provenance
        run: bun scripts/product-release.ts policy
        env:
          GH_TOKEN: ${{ github.token }}

  release-token-probe:
    name: Release Token Probe
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/th/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: manual-product-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Read-only verification of the built-in token and signed ledger commit
        run: bun scripts/product-release.ts probe
        env:
          GH_TOKEN: ${{ github.token }}

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Biome check
        run: bun run check

  unit-tests:
    name: Unit Tests (exclude old/)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build embedded search engine
        uses: ./.github/actions/setup-native-search
      - name: Run unit tests
        run: bun run test:unit

  worktree-bootstrap:
    name: Worktree Bootstrap Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run worktree bootstrap smoke test
        run: bun run test:worktree-bootstrap

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore project media cache
        uses: ./.github/actions/setup-project-media
      - name: Measure cold and warm project media
        if: github.event_name == 'workflow_dispatch' && inputs.project_media_cache_proof
        run: bun scripts/benchmark-project-media-cache.ts
      - name: Build embedded search engine
        uses: ./.github/actions/setup-native-search
      - name: Prepare local-only fixture data
        run: bun run test-env:reset-fs-only
        env:
          DB_PATH: ./test-data/sqlite.db
          LOCAL_CONTENT_BASE_PATH: ./test-data/local
          CONTENT_SOURCES: local
      - name: Build
        run: NODE_ENV=production bun run build
        env:
          DB_PATH: ./test-data/sqlite.db
          LOCAL_CONTENT_BASE_PATH: ./test-data/local
          CONTENT_SOURCES: local
          PUBLIC_API_BASE_URL: https://ivanli.cc
          PUBLIC_SITE_URL: https://ivanli.cc
          PUBLIC_SITE_BASE_PATH: /
      - name: Verify GitHub Pages custom-domain output
        run: bun ./scripts/verify-pages-build.ts
        env:
          PUBLIC_API_BASE_URL: https://ivanli.cc
          PUBLIC_SITE_URL: https://ivanli.cc
          PUBLIC_SITE_BASE_PATH: /

      - name: Build Storybook
        run: bun run build-storybook

      - name: Prepare Ubuntu archive for browser dependencies
        run: bash scripts/prepare-ci-apt-mirror.sh

      - name: Install Playwright Chromium for Storybook interactions
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Verify Storybook interactions
        run: bun run test:storybook-interactions

      - name: Prepare deterministic Playbook fixture
        run: bun tests/lib/playbook-fixture.ts .tmp/playbook-fixture

      - name: Verify Playbook static and console build
        shell: bash
        env:
          DB_PATH: ./test-data/sqlite.db
          LOCAL_CONTENT_BASE_PATH: ./test-data/local
          CONTENT_SOURCES: local
          PUBLIC_API_BASE_URL: https://ivanli.cc
          PUBLIC_SITE_URL: https://ivanli.cc
          PUBLIC_SITE_BASE_PATH: /
          PLAYBOOK_BUNDLE_DIR: .tmp/playbook-fixture
          PLAYBOOK_REQUIRED: "true"
          PLAYBOOK_USE_DEPLOYED: "false"
        run: |
          set -euo pipefail
          export PLAYBOOK_RENDERER_COMMIT="$(git rev-parse HEAD)"
          bun run frontend:build
          bun run console:build
          bun scripts/verify-playbook-artifact.ts
          bun run verify:playbook-build

  # Docker 仅构建校验（不推送）
  docker:
    # Keep the historical job name to avoid breaking required check contexts.
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      DB_PATH: ./test-data/sqlite.db
      LOCAL_CONTENT_BASE_PATH: ./test-data/local
      CONTENT_SOURCES: local
      PUBLIC_API_BASE_URL: https://console.ivanli.cc
      PUBLIC_SITE_URL: https://ivanli.cc
      PUBLIC_SITE_BASE_PATH: /
      PUBLIC_ASSISTANT_LAUNCHER_DEFAULT: "true"
      PUBLIC_CONTENT_BUNDLE_URL: preloaded
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/setup-native-search
      - uses: ./.github/actions/setup-project-media

      - name: Prepare local-only fixture data
        run: bun run test-env:reset-fs-only
        env:
          DB_PATH: ./test-data/sqlite.db
          LOCAL_CONTENT_BASE_PATH: ./test-data/local
          CONTENT_SOURCES: local

      - name: Prepare public snapshot for Docker build
        run: bun run public:export
        env:
          DB_PATH: ./test-data/sqlite.db
          LOCAL_CONTENT_BASE_PATH: ./test-data/local
          CONTENT_SOURCES: local
          PUBLIC_API_BASE_URL: https://ivanli.cc
          PUBLIC_SITE_URL: https://ivanli.cc
          PUBLIC_SITE_BASE_PATH: /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get Git information
        id: git-info
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME:-${GITHUB_HEAD_REF:-}}"
          if [ -z "$ref_name" ]; then
            ref_name="$(git rev-parse --abbrev-ref HEAD)"
          fi
          echo "commit_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_short_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "repository_url=https://github.com/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          echo "branch_name=${ref_name}" >> "$GITHUB_OUTPUT"
          echo "branch_url=https://github.com/${{ github.repository }}/tree/${ref_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare and verify native runtime bundle
        id: bundle
        shell: bash
        env:
          COMMIT_HASH: ${{ steps.git-info.outputs.commit_hash }}
          COMMIT_SHORT_HASH: ${{ steps.git-info.outputs.commit_short_hash }}
          BUILD_DATE: ${{ steps.git-info.outputs.build_date }}
          BRANCH_NAME: ${{ steps.git-info.outputs.branch_name }}
          BRANCH_URL: ${{ steps.git-info.outputs.branch_url }}
          REPOSITORY_URL: ${{ steps.git-info.outputs.repository_url }}
        run: |
          set -euo pipefail
          bun run image:prepare --profile ci --output "$RUNNER_TEMP/runtime-bundle"
          bun run image:verify --profile ci --source-sha "$COMMIT_HASH" --output "$RUNNER_TEMP/runtime-bundle"
          bun -e 'const m=await Bun.file(process.env.RUNNER_TEMP+"/runtime-bundle/manifest.json").json(); const h=new Bun.CryptoHasher("sha256").update(JSON.stringify(m.baseImages)).digest("hex"); console.log("scope=thin-runtime-v1-ubuntu24-amd64-"+h); console.log("config_digest="+m.configDigest)' >> "$GITHUB_OUTPUT"

      - name: Build Docker image for validation
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/runtime-bundle
          file: ${{ runner.temp }}/runtime-bundle/Dockerfile
          target: app-image-built
          platforms: ${{ env.PLATFORMS }}
          push: false
          load: true
          tags: blog:ci-smoke
          labels: |
            org.opencontainers.image.revision=${{ steps.git-info.outputs.commit_hash }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ steps.bundle.outputs.scope }}
          cache-to: type=gha,mode=min,scope=${{ steps.bundle.outputs.scope }}

      - name: Verify native bundle and thin image invalidation
        if: github.event_name == 'workflow_dispatch' && inputs.project_media_cache_proof
        run: bun scripts/verify-runtime-bundle-cache.ts
        env:
          BUILD_ARTIFACT_DIR: ${{ runner.temp }}/runtime-bundle
          EXPECTED_SOURCE_SHA: ${{ steps.git-info.outputs.commit_hash }}
          EXPECTED_CONFIG_DIGEST: ${{ steps.bundle.outputs.config_digest }}

      - name: Archive explicitly requested local packaging input
        if: github.event_name == 'workflow_dispatch' && inputs.export_runtime_bundle
        run: tar -czf "$RUNNER_TEMP/runtime-bundle.tar.gz" -C "$RUNNER_TEMP/runtime-bundle" .
      - name: Export verified native runtime bundle
        if: github.event_name == 'workflow_dispatch' && inputs.export_runtime_bundle
        uses: actions/upload-artifact@v7
        with:
          name: runtime-bundle-${{ github.sha }}-ci-ubuntu24-amd64
          path: ${{ runner.temp }}/runtime-bundle.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Smoke test single-image runtime
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ./test-data/job-logs

          wait_for_status() {
            local expected_status="$1"
            local url="$2"
            local output_file="$3"
            local attempts="${4:-90}"
            local sleep_seconds="${5:-2}"
            local status=""

            for _ in $(seq 1 "$attempts"); do
              status="$(curl -sS -o "$output_file" -w '%{http_code}' "$url" || true)"
              if [ "$status" = "$expected_status" ]; then
                return 0
              fi
              sleep "$sleep_seconds"
            done

            echo "Timed out waiting for ${url} to return ${expected_status}; last status=${status}" >&2
            cat "$output_file" >&2 || true
            return 1
          }

          wait_for_status_with_grep() {
            local expected_status="$1"
            local url="$2"
            local output_file="$3"
            local pattern="$4"
            local attempts="${5:-90}"
            local sleep_seconds="${6:-2}"
            local status=""

            for _ in $(seq 1 "$attempts"); do
              status="$(curl -sS -o "$output_file" -w '%{http_code}' "$url" || true)"
              if [ "$status" = "$expected_status" ] && grep -q "$pattern" "$output_file"; then
                return 0
              fi
              sleep "$sleep_seconds"
            done

            echo "Timed out waiting for ${url} to return ${expected_status} with pattern ${pattern}; last status=${status}" >&2
            cat "$output_file" >&2 || true
            return 1
          }

          wait_for_http() {
            local url="$1"
            local output_file="$2"
            local attempts="${3:-30}"
            local sleep_seconds="${4:-2}"
            local status=""

            for _ in $(seq 1 "$attempts"); do
              status="$(curl -sS -o "$output_file" -w '%{http_code}' "$url" || true)"
              if [ "$status" != "000" ]; then
                return 0
              fi
              sleep "$sleep_seconds"
            done

            echo "Timed out waiting for ${url} to accept HTTP; last status=${status}" >&2
            cat "$output_file" >&2 || true
            return 1
          }

          docker network create blog-ci-smoke-net >/dev/null 2>&1 || true
          docker rm -f imagorvideo-ci-smoke >/dev/null 2>&1 || true
          docker rm -f blog-ci-smoke >/dev/null 2>&1 || true

          docker run -d \
            --name imagorvideo-ci-smoke \
            --network blog-ci-smoke-net \
            -p 127.0.0.1:18000:8000 \
            -e IMAGOR_UNSAFE=1 \
            -e HTTP_LOADER_ALLOWED_SOURCES=blog-ci-smoke:25090 \
            -e HTTP_LOADER_HTTPS_ONLY=0 \
            -e HTTP_LOADER_BLOCK_PRIVATE_NETWORKS=0 \
            ghcr.io/cshum/imagorvideo:latest

          wait_for_http "http://127.0.0.1:18000/" "/tmp/imagor-health.txt"

          docker run -d \
            --name blog-ci-smoke \
            --network blog-ci-smoke-net \
            -p 127.0.0.1:25090:25090 \
            -e CONTENT_SOURCES=local \
            -e LOCAL_CONTENT_BASE_PATH=/app/data/local \
            -e DB_PATH=/app/data/sqlite.db \
            -e SITE_URL=http://127.0.0.1:25090 \
            -e PUBLIC_API_BASE_URL=http://127.0.0.1:25090 \
            -e PUBLIC_MEDIA_IMAGOR_BASE_URL=http://imagorvideo-ci-smoke:8000 \
            -e PUBLIC_MEDIA_INTERNAL_SOURCE_BASE_URL=http://blog-ci-smoke:25090 \
            -e PUBLIC_MEDIA_INTERNAL_SOURCE_SECRET=ci-smoke-media-source-secret \
            -e LLM_SETTINGS_MASTER_KEY=ci-smoke-llm-settings-master-key \
            -v "$PWD/test-data:/app/data" \
            blog:ci-smoke

          wait_for_status "200" "http://127.0.0.1:25090/api/health" "/tmp/docker-health.json"
          cat /tmp/docker-health.json
          python3 - <<'PY'
          import json
          with open("/tmp/docker-health.json", "r", encoding="utf-8") as f:
              health = json.load(f)
          assert health["status"] == "ok", health
          assert health["runtime"] == "console", health
          assert health["authenticated"] is False, health
          assert health["isAdmin"] is False, health
          PY

          wait_for_status \
            "200" \
            "http://127.0.0.1:25090/posts" \
            "/tmp/docker-posts.html"

          wait_for_status \
            "200" \
            "http://127.0.0.1:25090/api/public/posts?limit=20" \
            "/tmp/docker-posts.json"

          python3 - <<'PY'
          import json
          with open("/tmp/docker-posts.json", "r", encoding="utf-8") as f:
              payload = json.load(f)
          assert isinstance(payload, dict), payload
          assert "posts" in payload, payload
          assert payload["posts"], payload
          assert payload["pagination"]["totalPages"] >= 1, payload
          PY

          first_media_path="$(python3 - <<'PY'
          import json

          def iter_media_urls(item):
              if not isinstance(item, dict):
                  return

              variants = item.get("variants")
              if isinstance(variants, dict):
                  for key in ("cover", "card", "content", "full", "poster", "social", "play"):
                      url = variants.get(key)
                      if isinstance(url, str):
                          yield url
                  for url in variants.values():
                      if isinstance(url, str):
                          yield url

              for key in ("poster", "playback"):
                  url = item.get(key)
                  if isinstance(url, str):
                      yield url

              sources = item.get("sources")
              if isinstance(sources, list):
                  for source in sources:
                      if not isinstance(source, dict):
                          continue
                      url = source.get("url")
                      if isinstance(url, str):
                          yield url

          def iter_post_urls(post):
              image = post.get("image")
              if isinstance(image, str):
                  yield image

              media = post.get("media")
              if not isinstance(media, dict):
                  return

              for key in ("cover", "primary"):
                  yield from iter_media_urls(media.get(key))

              for bucket in ("content", "attachments"):
                  items = media.get(bucket)
                  if not isinstance(items, list):
                      continue
                  for item in items:
                      yield from iter_media_urls(item)

          with open("/tmp/docker-posts.json", "r", encoding="utf-8") as f:
              payload = json.load(f)

          for post in payload["posts"]:
              for candidate in iter_post_urls(post):
                  if candidate.startswith("/api/public/assets/"):
                      print(candidate, end="")
                      raise SystemExit(0)

          raise SystemExit("expected at least one facade media path in posts payload")
          PY
          )"

          wait_for_status \
            "200" \
            "http://127.0.0.1:25090${first_media_path}" \
            "/tmp/docker-first-media.bin"

          python3 - <<'PY'
          from pathlib import Path
          data = Path("/tmp/docker-first-media.bin").read_bytes()
          assert data, "expected non-empty public media response"
          PY

          wait_for_status \
            "200" \
            "http://127.0.0.1:25090/watermark-ivanli.svg" \
            "/tmp/docker-watermark.svg"

          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/docker-watermark.svg").read_text(encoding="utf-8")
          assert "<svg" in text, text
          assert "ivanli.cc" in text, text
          PY

          wait_for_status \
            "200" \
            "http://127.0.0.1:25090/api/public/comments?slug=graphql-api-best-practices" \
            "/tmp/docker-comments.json"
          python3 - <<'PY'
          import json
          with open("/tmp/docker-comments.json", "r", encoding="utf-8") as f:
              payload = json.load(f)
          assert isinstance(payload, dict), payload
          assert "comments" in payload, payload
          assert "totalPages" in payload, payload
          assert "isAdmin" in payload, payload
          PY

          wait_for_status "401" "http://127.0.0.1:25090/admin" "/tmp/docker-admin.html"

      - name: Dump docker smoke logs on failure
        if: failure()
        shell: bash
        run: |
          curl -sS -D - -o /dev/null http://127.0.0.1:18000/ || true
          docker logs imagorvideo-ci-smoke || true
          docker logs blog-ci-smoke || true

      - name: Cleanup docker smoke container
        if: always()
        shell: bash
        run: |
