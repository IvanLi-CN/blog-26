name: Manual Product Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable, alpha, beta, rc or forward-only full SemVer; empty means stable
        required: false
        type: string
      repair_release_id:
        description: Internal recovery only; abandon one failed merged release without artifacts
        required: false
        type: string
      abandon_frozen_inputs_id:
        description: Internal recovery only; abandon one failed merged release before products exist
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: manual-product-release
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
          REPAIR_RELEASE_ID: ${{ inputs.repair_release_id }}
        # The isolated repair branch is allowed only for the signed ledger recovery path below.
        run: >-
          test "$RELEASE_REF" = refs/heads/main ||
          (test "$RELEASE_REF" = refs/heads/th/release-ledger-repair &&
          test -n "$REPAIR_RELEASE_ID")
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Repair the failed release ledger with the Actions signing identity
        if: ${{ inputs.repair_release_id != '' }}
        run: bun scripts/product-release.ts repair-ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.repair_release_id }}
      - name: Abandon failed release after inputs-only freeze
        if: ${{ inputs.abandon_frozen_inputs_id != '' }}
        run: bun scripts/product-release.ts abandon-failed-inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.abandon_frozen_inputs_id }}
      - name: Reserve version, prepare the signed VERSION-only PR and dispatch exact-head gates
        if: ${{ inputs.repair_release_id == '' }}
        run: bun scripts/product-release.ts prepare
        env:
          GH_TOKEN: ${{ github.token }}
