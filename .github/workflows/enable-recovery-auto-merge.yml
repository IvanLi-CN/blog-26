name: Enable Recovery Auto Merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Recovery PR number
        required: true
        default: '210'
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  actions: write
  checks: read

jobs:
  enable:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number == '210') ||
      (github.event.pull_request.number == 210 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Enable protected auto-merge as Actions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
