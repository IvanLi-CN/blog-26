name: Abandon Cancelled Product Release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Cancelled merged release identity without frozen products
        required: true
        type: string

permissions:
  contents: read

jobs:
  abandon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: RELEASE_ID="${{ inputs.release_id }}" bun scripts/product-release.ts abandon-cancelled
        env:
          GH_TOKEN: ${{ github.token }}
