name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - guest
          - admin
          - user
          - mcp
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"

      - name: Cache Bun & deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start public media processor sidecar
        run: |
          wait_for_http() {
            local url="$1"
            local attempts="${2:-30}"
            local delay="${3:-1}"
            local status=""

            for _ in $(seq 1 "$attempts"); do
              status="$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)"
              if [ "$status" != "000" ]; then
                return 0
              fi
              sleep "$delay"
            done

            echo "Timed out waiting for HTTP readiness at ${url}; last status=${status}" >&2
            return 1
          }

          docker rm -f imagorvideo-e2e >/dev/null 2>&1 || true
          docker run -d \
            --name imagorvideo-e2e \
            --add-host host.docker.internal:host-gateway \
            -p 127.0.0.1:18000:8000 \
            -e IMAGOR_UNSAFE=1 \
            -e HTTP_LOADER_ALLOWED_SOURCES=host.docker.internal:25090 \
            -e HTTP_LOADER_HTTPS_ONLY=0 \
            -e HTTP_LOADER_BLOCK_PRIVATE_NETWORKS=0 \
            ghcr.io/cshum/imagorvideo:latest

          wait_for_http "http://127.0.0.1:18000/"

      - name: Run E2E tests
        run: bun run test:e2e:project -- ${{ matrix.project }}
        env:
          ADMIN_EMAIL: admin-${{ github.run_id }}-${{ github.run_attempt }}@test.local
          USER_EMAIL: user-${{ github.run_id }}-${{ github.run_attempt }}@test.local
          SSO_EMAIL_HEADER_NAME: Remote-Email
          PLAYWRIGHT_START_PUBLIC_MEDIA_SIDECAR: "0"
          PUBLIC_MEDIA_IMAGOR_BASE_URL: http://127.0.0.1:18000
          PUBLIC_MEDIA_INTERNAL_SOURCE_BASE_URL: http://host.docker.internal:25090

      - name: Dump public media processor logs on failure
        if: ${{ failure() }}
        run: |
          curl -sS -D - -o /dev/null http://127.0.0.1:18000/ || true
          docker logs imagorvideo-e2e || true

      - name: Cleanup public media processor sidecar
        if: ${{ always() }}
        run: docker rm -f imagorvideo-e2e >/dev/null 2>&1 || true
