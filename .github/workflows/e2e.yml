name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - th/site-knowledge-assistant
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}', github.event.pull_request.number) || format('e2e-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - guest
          - admin
          - user
          - mcp
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-ci-node

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore project media cache
        if: matrix.project != 'mcp'
        uses: ./.github/actions/setup-project-media

      - name: Prepare Ubuntu archive for browser dependencies
        run: bash scripts/prepare-ci-apt-mirror.sh

      - name: Install system dependencies
        run: |
          if command -v lsof >/dev/null 2>&1; then
            echo "Using runner-provided lsof"
          else
            sudo apt-get update && sudo apt-get install -y lsof
          fi

      - name: Install Playwright browsers
        if: matrix.project != 'mcp'
        run: npx playwright install --with-deps chromium

      - name: Build embedded search engine
        uses: ./.github/actions/setup-native-search

      - name: Run E2E tests
        run: bun scripts/run-e2e.ts ci-project ${{ matrix.project }}
        env:
          ADMIN_EMAIL: admin-${{ github.run_id }}-${{ github.run_attempt }}@test.local
          USER_EMAIL: user-${{ github.run_id }}-${{ github.run_attempt }}@test.local
          SSO_EMAIL_HEADER_NAME: Remote-Email

  web-demo:
    name: Playwright E2E (web-demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-ci-node

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore project media cache
        uses: ./.github/actions/setup-project-media

      - name: Prepare Ubuntu archive for browser dependencies
        run: bash scripts/prepare-ci-apt-mirror.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Web Demo artifacts
        run: bun run web-demo:build

      - name: Start Console Web Demo preview
        run: |
          WEB_DEMO_MODE=console WEB_DEMO_PORT=38210 bun scripts/preview-web-demo.ts > /tmp/blog-26-web-demo.log 2>&1 &
          echo $! > /tmp/blog-26-web-demo.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:38210/memos/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/blog-26-web-demo.log
          exit 1

      - name: Start public Web Demo preview
        run: |
          WEB_DEMO_MODE=public WEB_DEMO_PORT=38211 bun scripts/preview-web-demo.ts > /tmp/blog-26-public-web-demo.log 2>&1 &
          echo $! > /tmp/blog-26-public-web-demo.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:38211/posts/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/blog-26-public-web-demo.log
          exit 1

      - name: Run desktop Web Demo suites
        run: bunx playwright test --config tests/e2e/web-demo/ci.config.ts
        env:
          WEB_DEMO_TEST_URL: http://127.0.0.1:38211
          WEB_DEMO_CONSOLE_TEST_URL: http://127.0.0.1:38210
          WEB_DEMO_TEST_REPORT: test-results/web-demo-desktop.json

      - name: Run mobile Web Demo suites
        run: bunx playwright test --config tests/e2e/web-demo/ci.config.ts
        env:
          WEB_DEMO_TEST_URL: http://127.0.0.1:38211
          WEB_DEMO_CONSOLE_TEST_URL: http://127.0.0.1:38210
          WEB_DEMO_VIEWPORT: mobile
          WEB_DEMO_TEST_REPORT: test-results/web-demo-mobile.json

      - name: Stop Console Web Demo preview
        if: always()
        run: |
          if [ -f /tmp/blog-26-web-demo.pid ]; then
            kill "$(cat /tmp/blog-26-web-demo.pid)" || true
          fi
          if [ -f /tmp/blog-26-web-demo.log ]; then
            tail -n 200 /tmp/blog-26-web-demo.log
          fi

      - name: Stop public Web Demo preview
        if: always()
        run: |
          if [ -f /tmp/blog-26-public-web-demo.pid ]; then
            kill "$(cat /tmp/blog-26-public-web-demo.pid)" || true
          fi
          if [ -f /tmp/blog-26-public-web-demo.log ]; then
            tail -n 200 /tmp/blog-26-public-web-demo.log
          fi
