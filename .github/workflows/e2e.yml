name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - th/site-knowledge-assistant
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}', github.event.pull_request.number) || format('e2e-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - guest
          - admin
          - user
          - mcp
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y lsof

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build embedded search engine
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          RUSTUP_TOOLCHAIN=1.91.0 bun run search:native:build
          bun run search:native:verify

      - name: Run E2E tests
        run: bun run test:e2e:project -- ${{ matrix.project }}
        env:
          ADMIN_EMAIL: admin-${{ github.run_id }}-${{ github.run_attempt }}@test.local
          USER_EMAIL: user-${{ github.run_id }}-${{ github.run_attempt }}@test.local
          SSO_EMAIL_HEADER_NAME: Remote-Email

  web-demo:
    name: Playwright E2E (web-demo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Cache Bun & deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Web Demo artifacts
        run: bun run web-demo:build

      - name: Start Console Web Demo preview
        run: |
          WEB_DEMO_MODE=console WEB_DEMO_PORT=38210 bun scripts/preview-web-demo.ts > /tmp/blog-26-web-demo.log 2>&1 &
          echo $! > /tmp/blog-26-web-demo.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:38210/memos/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/blog-26-web-demo.log
          exit 1

      - name: Run Console Web Demo boundary tests
        run: bunx playwright test --retries=2 --config tests/e2e/web-demo/playwright.config.ts tests/e2e/web-demo/console-memo-boundary.spec.ts tests/e2e/web-demo/console-comments.spec.ts tests/e2e/web-demo/content-sync.spec.ts tests/e2e/web-demo/system-share.spec.ts
        env:
          WEB_DEMO_TEST_URL: http://127.0.0.1:38210
          WEB_DEMO_TEST_REPORT: test-results/web-demo-console-boundary.json

      - name: Run Console Web Demo boundary tests on mobile
        run: bunx playwright test --retries=2 --config tests/e2e/web-demo/playwright.config.ts tests/e2e/web-demo/console-memo-boundary.spec.ts tests/e2e/web-demo/console-comments.spec.ts tests/e2e/web-demo/content-sync.spec.ts tests/e2e/web-demo/system-share.spec.ts
        env:
          WEB_DEMO_TEST_URL: http://127.0.0.1:38210
          WEB_DEMO_VIEWPORT: mobile
          WEB_DEMO_TEST_REPORT: test-results/web-demo-console-boundary-mobile.json

      - name: Stop Console Web Demo preview
        if: always()
        run: |
          if [ -f /tmp/blog-26-web-demo.pid ]; then
            kill "$(cat /tmp/blog-26-web-demo.pid)" || true
          fi
          if [ -f /tmp/blog-26-web-demo.log ]; then
            tail -n 200 /tmp/blog-26-web-demo.log
          fi

      - name: Start public Web Demo preview
        run: |
          WEB_DEMO_MODE=public WEB_DEMO_PORT=38211 bun scripts/preview-web-demo.ts > /tmp/blog-26-public-web-demo.log 2>&1 &
          echo $! > /tmp/blog-26-public-web-demo.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:38211/posts/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/blog-26-public-web-demo.log
          exit 1

      - name: Run public Web Demo official routes
        run: bunx playwright test --config tests/e2e/web-demo/playwright.config.ts tests/e2e/web-demo/public-csr.spec.ts tests/e2e/web-demo/public-comments.spec.ts tests/e2e/web-demo/project-runtime-motion.spec.ts tests/e2e/web-demo/search-modes.spec.ts tests/e2e/web-demo/github-admin-binding.spec.ts tests/e2e/web-demo/public-cover-media.spec.ts
        env:
          WEB_DEMO_TEST_URL: http://127.0.0.1:38211
          WEB_DEMO_TEST_REPORT: test-results/web-demo-public-routes.json

      - name: Run public Web Demo official routes on mobile
        run: bunx playwright test --config tests/e2e/web-demo/playwright.config.ts tests/e2e/web-demo/public-csr.spec.ts tests/e2e/web-demo/public-comments.spec.ts tests/e2e/web-demo/project-runtime-motion.spec.ts tests/e2e/web-demo/search-modes.spec.ts tests/e2e/web-demo/github-admin-binding.spec.ts tests/e2e/web-demo/public-cover-media.spec.ts
        env:
          WEB_DEMO_TEST_URL: http://127.0.0.1:38211
          WEB_DEMO_VIEWPORT: mobile
          WEB_DEMO_TEST_REPORT: test-results/web-demo-public-routes-mobile.json

      - name: Stop public Web Demo preview
        if: always()
        run: |
          if [ -f /tmp/blog-26-public-web-demo.pid ]; then
            kill "$(cat /tmp/blog-26-public-web-demo.pid)" || true
          fi
          if [ -f /tmp/blog-26-public-web-demo.log ]; then
            tail -n 200 /tmp/blog-26-public-web-demo.log
          fi
