name: Setup native search
description: Reuse an exact native search build and verify its runtime contract.
runs:
  using: composite
  steps:
    - name: Identify runner image
      id: platform
      shell: bash
      run: echo "image=${ImageOS:?Missing hosted runner image family}-${ImageVersion:?Missing hosted runner image version}" >> "$GITHUB_OUTPUT"
    - name: Restore native search module
      id: native
      uses: actions/cache@v6
      with:
        path: native/search/search.linux-x64.node
        key: native-search-v1-${{ steps.platform.outputs.image }}-${{ runner.os }}-${{ runner.arch }}-rust-1.91.0-bun-1.4.2-${{ hashFiles('native/search/Cargo.toml', 'native/search/Cargo.lock', 'native/search/build.rs', 'native/search/src/**', 'scripts/build-native-search.sh') }}
    - name: Compile native search on cache miss
      if: steps.native.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rustup toolchain install 1.91.0 --profile minimal
        RUSTUP_TOOLCHAIN=1.91.0 bun run search:native:build
    - name: Verify native search on every run
      shell: bash
      run: bun run search:native:verify
