name: Set up pinned CI Node
description: Verify the official Node archive before seeding the standard tool cache
runs:
  using: composite
  steps:
    - name: Restore official Node archive
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/ci-node-22.23.2-linux-x64.tar.xz
        key: ci-node-archive-v1-linux-x64-22.23.2-d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307
    - name: Verify and prepare Node tool cache
      shell: bash
      run: python3 scripts/prepare-ci-node.py
    - uses: actions/setup-node@v7
      with:
        node-version: 22.23.2
