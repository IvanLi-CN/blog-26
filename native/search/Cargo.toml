[package]
name = "blog-search"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tantivy = "=0.26.2"
napi = { version = "=3.14.2", features = ["napi8"] }
napi-derive = "=3.6.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
strip = "debuginfo"
